services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eventcrowd
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: eventcrowd
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data", "./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro", "./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventcrowd"]
      interval: 5s
      retries: 15
  mongo:
    image: mongo:7
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo_data:/data/db"]
volumes:
  postgres_data:
  mongo_data:
